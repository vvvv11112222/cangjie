  function managementAction(name,id){
    if(name.startsWith('org-')){
      if(state.role!=='admin')return true;
      if(name==='org-tab'){ui.orgTab=id;render();return true;}
      const [kind,itemId]=(id||'').split(':');
      if(name==='org-new'||name==='org-edit'){organizationModal(kind,itemId);return true;}
      if(name==='org-delete')confirmManagementDelete('org',id);return true;
    }
    if(name.startsWith('account-')){
      if(!canManageAcademic())return true;
      if(name==='account-edit'){accountModal(id);return true;}
      const a=manageableAccounts().find(a=>a.id===id);if(!a||a.id==='a1')return true;
      if(name==='account-toggle'){a.enabled=!a.enabled;log(a.enabled?'启用账号':'停用账号',a.username,collegeName(a.collegeId));render();toast('账号状态已更新。');}
      if(name==='account-delete')confirmManagementDelete('account',id);return true;
    }
    if(name.startsWith('record-')){
      if(state.role!=='admin')return true;
      if(name==='record-reset'){ui.recordCollege='';ui.recordGrade='';ui.recordClass='';ui.recordSearch='';render();}
      if(name==='record-edit')recordModal(id);
      if(name==='record-detail')recordDetail(getSession(id));
      if(name==='record-delete')confirmManagementDelete('record',id);
      if(name==='record-copy'){const s=getSession(id);if(s&&safeRecordingUrl(s.recordingUrl)){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s.recordingUrl).then(()=>toast('录像链接已复制。')).catch(()=>showCopyLink(s));else showCopyLink(s);}}
      return true;
    }
    if(name==='management-delete'){deleteManagementRecord(id);return true;}
    if(name==='schedule-edit'){scheduleModal(id);return true;}
    if(name==='schedule-delete'){if(canManageAcademic()&&scopedSchedule().some(w=>w.id===id))confirmManagementDelete('schedule',id);return true;}

  function deleteManagementRecord(value){
    const [type,...parts]=value.split(':'),id=parts.join(':');
    if(type==='org'&&state.role==='admin'){
      const [kind,oid]=parts;if(!['colleges','grades','classes'].includes(kind))return;
      const referenced=kind==='colleges'?state.grades.some(g=>g.collegeId===oid)||state.classes.some(c=>c.collegeId===oid)||state.accounts.some(a=>a.collegeId===oid)||state.sessions.some(s=>s.collegeId===oid):kind==='grades'?state.classes.some(c=>c.gradeId===oid):state.sessions.some(s=>s.classId===oid)||offerings.some(o=>o.classId===oid);
      if(referenced){toast('该组织仍有关联的人员、下级组织、开课实例或录像，请先处理关联数据。',true);return;}
      state[kind]=state[kind].filter(r=>r.id!==oid);
    }else if(type==='account'&&canManageAcademic()){
      if(id==='a1'||!manageableAccounts().some(a=>a.id===id))return;state.accounts=state.accounts.filter(a=>a.id!==id);
    }else if(type==='record'&&state.role==='admin'){
      if(activeSessionId===id){clearInterval(activeTimer);activeTimer=null;activeSessionId=null;}
      if(media.has(id)){URL.revokeObjectURL(media.get(id));media.delete(id);}state.sessions=state.sessions.filter(s=>s.id!==id);
    }else if(type==='schedule'&&canManageAcademic()&&scopedSchedule().some(w=>w.id===id)){state.schedule=state.schedule.filter(w=>w.id!==id);}else return;
    log('删除管理记录',id,type);closeModal();render();toast('已删除。');
  }

      if(!name)return !failManagement('请填写名称。');

      if(kind==='classes'&&!state.grades.some(g=>g.id===gradeId&&g.collegeId===collegeId))return !failManagement('请选择该学院下的年级。');
      if(state[kind].some(r=>r.id!==id&&r.name===name&&(kind==='colleges'||r.collegeId===collegeId&&(kind!=='classes'||r.gradeId===gradeId))))return !failManagement('同一组织层级下名称不能重复。');
      if(old&&kind==='grades'&&old.collegeId!==collegeId&&state.classes.some(c=>c.gradeId===id))return !failManagement('该年级已有班级，请先调整所属班级后再变更学院。');
      if(old&&kind==='classes'&&old.collegeId!==collegeId&&(state.sessions.some(s=>s.classId===id)||offerings.some(o=>o.classId===id)))return !failManagement('该班级已有课堂或开课实例，请先处理关联后再跨学院移动。');
      const row={id:id||'org'+Date.now().toString(36),name,...(kind!=='colleges'?{collegeId}:{}),...(kind==='classes'?{gradeId}:{})};
      if(old)Object.assign(old,row);else state[kind].push(row);
      if(kind==='classes'){state.sessions.filter(s=>s.classId===row.id).forEach(s=>{s.className=name;s.collegeId=collegeId;});offerings.filter(o=>o.classId===row.id).forEach(o=>{o.className=name;o.collegeId=collegeId;});}

      const r=data.get('role'),name=String(data.get('name')||'').trim(),username=String(data.get('username')||'').trim(),collegeId=r==='admin'?'':state.role==='academic'?currentAccount().collegeId:data.get('collegeId');

      if(state.accounts.some(a=>a.id!==id&&a.username===username))return !failManagement('登录账号已存在。');
      if(id==='a1'&&(r!=='admin'||!data.has('enabled')))return !failManagement('内置系统管理员必须保持启用与最高权限。');
      const permissions=['supervisor','teacher'].includes(r)?data.getAll('permissions').filter(p=>permissionLabels[p]&&(p!=='publish'||r==='supervisor')):[];
      if(permissions.some(p=>p!=='view')&&!permissions.includes('view'))return !failManagement('使用上传、分析或复核等功能前，请先授予查看权限。');
      if(permissions.includes('publish')&&!permissions.includes('review'))return !failManagement('发布报告需要同时授予复核权限。');
      const row={id:id||'a'+Date.now().toString(36),name,username,role:r,collegeId,enabled:data.has('enabled'),permissions};
      if(old)Object.assign(old,row);else state.accounts.push(row);log('维护账号权限',username,collegeName(collegeId));
    }
    if(form.getAttribute('id')==='record-form'){
      if(state.role!=='admin')return true;const old=id?getSession(id):null,c=classInfo(data.get('classId'));if(id&&!old)return true;

      const row={classId:c.id,collegeId:c.collegeId,className:c.name,recordingUrl,exampleLink:old?.recordingUrl===recordingUrl?!!old.exampleLink:false};
      for(const key of ['title','course','teacher','room','date','time']){row[key]=String(data.get(key)||'').trim();if(!row[key])return !failManagement('请填写完整的课堂信息。');}

      log('维护录像记录',row.title,collegeName(c.collegeId)+' / '+c.name);
    }
    closeModal();render();toast('已保存到当前浏览器。');return true;
  }

  function startSimulation(id) {
    const s=getSession(id);
    if(!canRead(s)||!hasPermission('analyze')){toast('当前角色无法操作这个分析任务。',true);return;}
    if(activeSessionId===id)return;
    if(activeTimer){s.status='queued';persist();render();toast('任务已加入演示队列，将顺序处理。');return;}
    if(state.settings.spent>=state.settings.budget){s.status='failed';s.error='模拟模型预算已用完，请由系统管理员调整预算。';persist();render();toast(s.error,true);return;}
    state.sessions.forEach(other=>{if(other.id!==id&&other.status==='processing')other.status='queued';});
    s.status='processing';s.error='';s.progress=Math.min(s.progress||0,80);activeSessionId=id;persist();render();
    activeTimer=setInterval(()=>{
      s.progress=Math.min(100,s.progress+10);
      if(s.progress===100){
        clearInterval(activeTimer);activeTimer=null;activeSessionId=null;s.status='review';s.report=reportFor(s,!s.fixture);
        log('模拟分析完成',s.title,'仅推进原型流程，未运行 ASR 或外部模型');toast('流程演示已完成，可打开报告查看。');
        const next=state.sessions.find(item=>item.status==='queued'&&canRead(item));
        if(next)setTimeout(()=>startSimulation(next.id),400);
      }
      persist();
      if(!$('#modal').open&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))render();
    },700);
  }
  function cancelTask(s) {
    if(!canRead(s)||!hasPermission('analyze'))return;
    if(activeSessionId===s.id){clearInterval(activeTimer);activeTimer=null;activeSessionId=null;}
    s.status='cancelled';log('取消模拟任务',s.title,'保留本地档案，可重新开始演示');render();toast('模拟任务已取消。');
  }

  function editObservation(s,reject) {
    if(!canRead(s)||!hasPermission('review')||!s.report||s.report.status==='published')return;

  }
  function publish(s) {
    if(!canRead(s)||!hasPermission('review')||!s.report||s.report.status==='published')return;

    if(key){const pos=event.target.selectionStart;ui[key]=event.target.value;render();const input=$('[data-management-search="'+key+'"]');input.focus();input.setSelectionRange(pos,pos);return;}
    if(event.target.id==='session-search'){const input=event.target,pos=input.selectionStart;ui.search=input.value;render();const replacement=$('#session-search');replacement.focus();replacement.setSelectionRange(pos,pos);}
    if(event.target.id==='evidence-range'){ui.evidenceTime=Number(event.target.value);$('#video-position').textContent=timeText(ui.evidenceTime);}
  });
  document.addEventListener('change',event=>{
    const key=event.target.dataset.managementFilter;
    if(key){ui[key]=event.target.value;if(key==='recordCollege'){ui.recordGrade='';ui.recordClass='';}if(key==='recordGrade')ui.recordClass='';render();return;}
    if(event.target.closest('#organization-form')&&event.target.name==='collegeId'){
      const grade=$('#organization-form [name="gradeId"]');if(grade)grade.innerHTML=options(state.grades.filter(g=>g.collegeId===event.target.value),'','请选择年级');
    }
    if(event.target.closest('#account-form')&&event.target.name==='role')updateAccountFields();
    if(event.target.id==='upload-file')selectFile(event.target.files[0]);
    if(event.target.id==='preview-file'){
      const file=event.target.files[0],id=event.target.dataset.sessionId;
      if(!file)return;
      if(!/\.(mp4|webm)$/i.test(file.name)||!file.size||file.size>1073741824){toast('请选择不超过 1 GiB 的非空 MP4 / WebM。',true);return;}
      if(!canRead(getSession(id)))return;
      if(media.has(id))URL.revokeObjectURL(media.get(id));media.set(id,URL.createObjectURL(file));closeModal();render();toast('已加载本地视频，仅用于播放预览。');
    }
  });
  $('#sidebar-backdrop').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#sidebar-backdrop').classList.remove('open');});
  $('.skip-link').addEventListener('click',event=>{event.preventDefault();$('#main').focus();});
  $('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const rect=event.target.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal();}});
  $('#modal').addEventListener('cancel',event=>{event.preventDefault();closeModal();});
  window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
  $('#search-icon').innerHTML=icon('search');$('.notification-button').innerHTML=icon('bell');$('.menu-toggle').innerHTML=icon('menu');
  render();
})();

</script>
</body>
</html>
