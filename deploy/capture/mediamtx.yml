# Pinned MediaMTX v1.15.3. Run from repository root. Env MTX_* can override paths/ports.
# Public access MUST go through the HTTPS gateway; the Control API is loopback only.
logLevel: warn
authMethod: http
authHTTPAddress: http://127.0.0.1:8080/internal/v1/streams/auth
authHTTPExclude: []
api: yes
apiAddress: 127.0.0.1:9997
rtsp: no
rtmp: no
hls: no
srt: no
playback: no
webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: :8189
# Replace with the computer LAN address reachable by the phone.
webrtcAdditionalHosts: [192.168.1.10]
pathDefaults:
  source: publisher
  overridePublisher: no
  record: yes
  recordPath: ./var/capture-recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 30s
  recordMaxPartSize: 50M
  recordDeleteAfter: 0s
  runOnReady: ./var/bin/capture-hook.exe online
  runOnNotReady: ./var/bin/capture-hook.exe offline
  runOnRecordSegmentCreate: ./var/bin/capture-hook.exe segment_started
  runOnRecordSegmentComplete: ./var/bin/capture-hook.exe segment_complete
paths:
  '~^captures/[0-9a-f-]{36}/[0-9]+$': {}
