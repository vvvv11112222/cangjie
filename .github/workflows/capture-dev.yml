name: Capture development environment
on:
  pull_request:
    paths:
      - 'tools/capture_dev.py'
      - 'tools/capture_worker_job.py'
      - 'tools/test_capture_dev.py'
      - 'deploy/capture/**'
      - '.github/workflows/capture-dev.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Verify lifecycle and environment isolation
        run: python -m unittest discover -s tools -p test_capture_dev.py
