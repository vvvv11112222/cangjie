name: Team website launcher
on:
  pull_request:
    paths:
      - 'tools/team_web.py'
      - 'tools/start_team_web.ps1'
      - 'tools/start_team_web.bat'
      - 'tools/test_team_web.py'
      - 'deploy/team-web/**'
      - '.github/workflows/team-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Check launcher environment and ownership boundaries
        run: python -m unittest discover -s tools -p test_team_web.py
      - name: Parse PowerShell startup script
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/start_team_web.ps1), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
