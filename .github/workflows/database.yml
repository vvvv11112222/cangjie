name: Database acceptance
on:
  pull_request:
    paths:
      - 'database/**'
      - 'internal/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'tools/check_database.mjs'
      - 'tools/check_schema.mjs'
      - 'tools/upgrade_cases.mjs'
      - '.github/workflows/database.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-17:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: dbtest
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbtest -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_ACCEPTANCE_URL: postgres://dbtest:disposable-test-password@127.0.0.1:5432/cangjie_database_acceptance?sslmode=disable
      DATABASE_ACCEPTANCE_ALLOW_RESET: '1'
      TEST_DATABASE_URL: postgres://dbtest:disposable-test-password@127.0.0.1:5432/cangjie_backend_acceptance?sslmode=disable
      PGPASSWORD: disposable-test-password
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.0'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Create disposable databases and test dependencies
        run: |
          psql -h 127.0.0.1 -U dbtest -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cangjie_database_acceptance'
          psql -h 127.0.0.1 -U dbtest -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cangjie_backend_acceptance'
          npm install --prefix "$RUNNER_TEMP/database-tools" --ignore-scripts --no-audit --no-fund pg@8.16.3 @electric-sql/pglite@0.5.8
          python -m pip install jsonschema==4.25.1
      - name: Native upgrade, backend integration and race checks
        run: go test -p 1 -race -count=1 ./...
      - name: Native competing transactions and historical upgrades
        run: node tools/check_database.mjs "$RUNNER_TEMP/database-tools/node_modules/pg"
      - name: Contracts, complete migration chain and static checks
        run: |
          python tools/check_docs.py
          node tools/check_schema.mjs "$RUNNER_TEMP/database-tools/node_modules/@electric-sql/pglite"
          go vet ./...
          go build ./cmd/...
