name: Vision worker

on:
  pull_request:
    paths:
      - 'workers/**'
      - 'contracts/**'
      - 'tools/check_docs.py'
      - 'tools/contract_rules.py'
      - 'pytest.ini'
      - '.dockerignore'
      - '.github/workflows/vision-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vision-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    name: Worker tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      VISION_RUNTIME: cpu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: workers/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r workers/requirements.lock
      - name: Verify environment and contracts
        run: |
          python -m pip check
          python tools/check_docs.py
          python -m workers runtime-info
      - name: Test worker and generated media
        run: python -m pytest -q

  cpu-container:
    name: CPU container
    needs: worker-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build CPU image
        run: docker build -f workers/Dockerfile -t cangjie-video-worker:ci .
      - name: Check actual runtime
        run: docker run --rm cangjie-video-worker:ci python -m workers runtime-info
      - name: Test worker inside image
        run: docker run --rm cangjie-video-worker:ci python -m pytest -q --basetemp=/tmp/vision-tests /app/workers/tests
