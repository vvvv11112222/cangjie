services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: teaching
      POSTGRES_USER: teaching
      POSTGRES_PASSWORD: teaching_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teaching -d teaching"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${COMPOSE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["/app/bin/migrate", "-dir", "/app/database"]
    environment: &api-environment
      APP_ENV: development
      API_LISTEN_ADDR: 0.0.0.0:8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:${COMPOSE_API_PORT:-8080}}
      SESSION_TTL_SECONDS: "28800"
      DATABASE_URL: postgres://teaching:teaching_dev@postgres:5432/teaching?sslmode=disable
      MEDIA_ROOT: /data/media
      WORKER_TEMP_ROOT: /data/worker-tmp
      DELETION_LEDGER_PATH: /data/governance/deletions.jsonl
      WORKER_TOKEN: ${WORKER_TOKEN:-development-worker-token-change-me}
      WORKER_ID: worker-01
      WORKER_CAPABILITIES: probe,audio_analysis,video_analysis
      WORKER_PROCESSOR_VERSION: fixed-json-v1
      FFMPEG_BUILD_SHA256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ASR_MODEL_NAME: fixed-json-asr
      ASR_MODEL_REVISION: p0-v1
      REPORT_API_BASE: ${REPORT_API_BASE:-}
      REPORT_API_KEY: ${REPORT_API_KEY:-}
      REPORT_MODEL: ${REPORT_MODEL:-}
      REPORT_MODEL_REVISION: ${REPORT_MODEL_REVISION:-}
      REPORT_PROMPT_VERSION: ${REPORT_PROMPT_VERSION:-p0-v1}
      REPORT_PROMPT_SHA256: ${REPORT_PROMPT_SHA256:-}
      REPORT_SELECTION_VERSION: ${REPORT_SELECTION_VERSION:-time-window-v1}
      REPORT_TIMEOUT_SECONDS: ${REPORT_TIMEOUT_SECONDS:-180}
      REPORT_MAX_INPUT_TOKENS: ${REPORT_MAX_INPUT_TOKENS:-8000}
      REPORT_MAX_OUTPUT_TOKENS: ${REPORT_MAX_OUTPUT_TOKENS:-3000}
      MODEL_MONTHLY_BUDGET: ${MODEL_MONTHLY_BUDGET:-0}
      MODEL_PRICE_VERSION: ${MODEL_PRICE_VERSION:-}
      MODEL_INPUT_PRICE_PER_MILLION: ${MODEL_INPUT_PRICE_PER_MILLION:-0}
      MODEL_OUTPUT_PRICE_PER_MILLION: ${MODEL_OUTPUT_PRICE_PER_MILLION:-0}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${COMPOSE_API_PORT:-8080}:8080"
    volumes:
      - app-data:/data

  bootstrap-admin:
    profiles: ["bootstrap"]
    build: .
    command: ["/app/bin/bootstrap-admin"]
    environment:
      <<: *api-environment
      BOOTSTRAP_SCHOOL_CODE: SCHOOL
      BOOTSTRAP_SCHOOL_NAME: 示例学校
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_DISPLAY_NAME: 系统管理员
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed-dev:
    profiles: ["bootstrap"]
    build: .
    command: ["/app/bin/seed-dev"]
    environment:
      <<: *api-environment
      BOOTSTRAP_SCHOOL_CODE: SCHOOL
      BOOTSTRAP_SCHOOL_NAME: 示例学校
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_DISPLAY_NAME: 系统管理员
      BOOTSTRAP_TEST_PASSWORD: ${BOOTSTRAP_TEST_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  app-data:
