services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: teaching
      POSTGRES_USER: teaching
      POSTGRES_PASSWORD: teaching_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teaching -d teaching"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${COMPOSE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["/app/bin/migrate", "-dir", "/app/database"]
    environment: &api-environment
      APP_ENV: development
      API_LISTEN_ADDR: 0.0.0.0:8080
      PUBLIC_ORIGIN: http://localhost:8080
      SESSION_TTL_SECONDS: "28800"
      DATABASE_URL: postgres://teaching:teaching_dev@postgres:5432/teaching?sslmode=disable
      MEDIA_ROOT: /data/media
      WORKER_TEMP_ROOT: /data/worker-tmp
      DELETION_LEDGER_PATH: /data/governance/deletions.jsonl
      MODEL_MONTHLY_BUDGET: "0"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${COMPOSE_API_PORT:-8080}:8080"
    volumes:
      - app-data:/data

  bootstrap-admin:
    profiles: ["bootstrap"]
    build: .
    command: ["/app/bin/bootstrap-admin"]
    environment:
      <<: *api-environment
      BOOTSTRAP_SCHOOL_CODE: SCHOOL
      BOOTSTRAP_SCHOOL_NAME: 示例学校
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_DISPLAY_NAME: 系统管理员
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed-dev:
    profiles: ["bootstrap"]
    build: .
    command: ["/app/bin/seed-dev"]
    environment:
      <<: *api-environment
      BOOTSTRAP_SCHOOL_CODE: SCHOOL
      BOOTSTRAP_SCHOOL_NAME: 示例学校
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_DISPLAY_NAME: 系统管理员
      BOOTSTRAP_TEST_PASSWORD: ${BOOTSTRAP_TEST_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  app-data:
